services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudstart
      POSTGRES_USER: cloudstart_admin
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstart_admin -d cloudstart"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: cloudstart
      DB_USER: cloudstart_admin
      DB_PASSWORD: local-development-only
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "8080:80"
    volumes:
      - ./apps/frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
