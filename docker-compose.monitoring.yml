services:
  zabbix-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: local-zabbix-only
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 12

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-8.0-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: local-zabbix-only
      ZBX_SERVER_NAME: cloudstart-zabbix-local
    ports:
      - "10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-8.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: local-zabbix-only
      PHP_TZ: America/Sao_Paulo
      ZBX_SERVER_NAME: cloudstart-zabbix-local
    ports:
      - "8081:8080"
    depends_on:
      zabbix-server:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-only-change-me
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: alexanderzobnin-zabbix-app@6.8.0
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports:
      - "3000:3000"
    depends_on:
      zabbix-web:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  zabbix_db_data:
  grafana_data:
