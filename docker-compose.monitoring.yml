services:
  zabbix-db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: local-zabbix-only
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 12

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4.15
    environment:
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: local-zabbix-only
      ZBX_SERVER_NAME: cloudstart-zabbix-local
    ports:
      - "127.0.0.1:10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.15
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: local-zabbix-only
      PHP_TZ: America/Sao_Paulo
      ZBX_SERVER_NAME: cloudstart-zabbix-local
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      zabbix-server:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-only-change-me
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: alexanderzobnin-zabbix-app@6.8.0
      GF_SERVER_ROOT_URL: http://localhost:3000/
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      zabbix-web:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana

  monitoring-bootstrap:
    image: python:3.12-alpine
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_PASSWORD: local-grafana-only-change-me
      ZABBIX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_WEB_CHECK_URL: http://zabbix-web:8080/
      GRAFANA_HEALTH_CHECK_URL: http://grafana:3000/api/health
      ZABBIX_PASSWORD: local-zabbix-bootstrap-only
      MONITOR_CLOUDWATCH: "false"
    command: ["python", "/opt/nova/bootstrap.py"]
    volumes:
      - ./monitoring/bootstrap.py:/opt/nova/bootstrap.py:ro
    depends_on:
      zabbix-web:
        condition: service_started
      grafana:
        condition: service_started
    restart: on-failure

volumes:
  zabbix_db_data:
  grafana_data:
