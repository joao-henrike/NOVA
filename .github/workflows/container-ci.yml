name: Container CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "docker-compose.yml"
      - "docker-compose.monitoring.yml"
      - ".github/workflows/container-ci.yml"
  push:
    branches:
      - main
      - Joao
    paths:
      - "apps/**"
      - "docker-compose.yml"
      - "docker-compose.monitoring.yml"
      - ".github/workflows/container-ci.yml"

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app tests

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-and-scan:
    name: Build and Scan Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/frontend
          load: true
          tags: cloudstart/frontend:ci-${{ github.sha }}
          push: false

      - name: Build backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/backend
          load: true
          tags: cloudstart/backend:ci-${{ github.sha }}
          push: false

      - name: Run backend unit tests
        run: docker run --rm cloudstart/backend:ci-${{ github.sha }} python -m unittest discover -s /app/tests -v

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudstart/frontend:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudstart/backend:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Validate Application Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Zabbix and Grafana Compose file
        run: docker compose -f docker-compose.monitoring.yml config --quiet
