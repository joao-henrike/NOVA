name: NOVA Resilience Unit Tests

on:
  push:
    branches: [main, Joao]
    paths:
      - "resilience/**"
      - ".github/workflows/resilience-unit-tests.yml"
  pull_request:
    paths:
      - "resilience/**"
      - ".github/workflows/resilience-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Compile resilience suite
        run: python -m compileall -q resilience
      - name: Run offline safeguards
        run: python -m unittest discover -s resilience/tests -v
