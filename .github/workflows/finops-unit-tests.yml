name: NOVA FinOps Offline Tests

on:
  push:
    branches: [main, Joao]
    paths:
      - "finops/**"
      - ".github/workflows/finops-unit-tests.yml"
  pull_request:
    paths:
      - "finops/**"
      - ".github/workflows/finops-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: |
          python3 -m compileall -q finops
          bash -n finops/run.sh
      - name: Offline AWS API mock tests
        run: python3 -m unittest discover -s finops/tests -v
